<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Showcase</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; line-height: 1.6; padding-top: 70px; max-width: 650px; margin: 0 auto; overflow-x: hidden; }

        /* 헤더 */
        .header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background-color: rgba(13, 17, 23, 0.85); backdrop-filter: blur(10px); border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .menu-btn { background: none; border: none; color: #f0f6fc; font-size: 22px; cursor: pointer; }
        .logo { font-size: 15px; font-weight: 700; color: #f0f6fc; }

        /* 사이드바 */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background-color: #161b22; border-right: 1px solid #30363d; z-index: 200; transition: left 0.3s ease; padding: 24px 20px; }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 12px; border-bottom: 1px solid #30363d; }
        .sidebar-close { background: none; border: none; color: #8b949e; font-size: 20px; cursor: pointer; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 20px; }
        .sidebar-menu a { color: #c9d1d9; text-decoration: none; font-size: 15px; cursor: pointer; display: block; }
        .sidebar-menu a:hover { color: #58a6ff; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* 이미지 모달 팝업 */
        .image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px; }
        .image-modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; max-width: 400px; width: 100%; text-align: center; position: relative; }
        .modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #8b949e; font-size: 20px; cursor: pointer; }
        .modal-content img { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 12px; margin-top: 15px; display: block; }

        /* 메인 컨텐츠 */
        .container { padding: 20px; }
        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 28px; background: linear-gradient(135deg, #7ee787, #58a6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <header class="header">
        <button class="menu-btn" id="openBtn">☰</button>
        <div class="logo">⚡ GitHub Actions</div>
        <div style="width: 22px;"></div>
    </header>

    <div class="overlay" id="overlay"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span style="font-weight: 700; color: #f0f6fc;">Menu</span>
            <button class="sidebar-close" id="closeBtn">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li><a id="firstMenuBtn">1. Overview (이미지 보기)</a></li>
            <li><a href="#">2. Features</a></li>
            <li><a href="#">3. Marketplace</a></li>
            <li><a href="#">4. Documentation</a></li>
            <li><a href="#">5. Pricing</a></li>
        </ul>
    </nav>

    <!-- 이미지 모달 -->
    <div class="image-modal" id="imageModal">
        <div class="modal-content">
            <button class="modal-close" id="modalCloseBtn">✕</button>
            <h3 style="font-size: 16px; color: #f0f6fc;">Overview Image</h3>
            <!-- 이미지 경로 연결 -->
            <img id="popupImage" src="overview.jpeg" alt="Overview Image">
        </div>
    </div>

    <div class="container">
        <div class="hero">
            <h1>Automate your workflow</h1>
            <p>GitHub Actions showcase page</p>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const firstMenuBtn = document.getElementById('firstMenuBtn');
        const imageModal = document.getElementById('imageModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // 메뉴 열기/닫기
        openBtn.addEventListener('click', () => {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        });

        function closeMenu() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        // 첫 번째 메뉴 클릭 시 모달 열기
        firstMenuBtn.addEventListener('click', () => {
            closeMenu();
            imageModal.classList.add('active');
        });

        // 모달 닫기
        modalCloseBtn.addEventListener('click', () => {
            imageModal.classList.remove('active');
        });

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
