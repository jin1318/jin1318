<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정기기부 활용 현황</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; padding: 16px; max-width: 600px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #0d9488, #115e59); color: #fff; padding: 24px 20px; border-radius: 16px; margin-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .header p { font-size: 13px; opacity: 0.9; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 16px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-value { font-size: 20px; font-weight: 800; color: #0d9488; margin-top: 4px; }
        .stat-label { font-size: 12px; color: #64748b; }
        .section-box { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #e9ecef; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #1e293b; }
        .usage-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .usage-item:last-child { border-bottom: none; }
        .usage-badge { background: #ccfbf1; color: #0f766e; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .footer { text-align: center; padding: 16px 0; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>투명한 기부금 집행 현황 📊</h1>
        <p>임직원 여러분께서 모아주신 소중한 기부금 사용 결과입니다.</p>
    </div>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="stat-label">참여 임직원</div>
            <div class="stat-value">124 명</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">누적 모금액</div>
            <div class="stat-value">1,250 만원</div>
        </div>
    </div>

    <div class="section-box">
        <h2 class="section-title">주요 사업별 집행 비율</h2>
        <div class="usage-item">
            <span>취약계층 아동 교육 지원</span>
            <span class="usage-badge">45%</span>
        </div>
        <div class="usage-item">
            <span>지역사회 독거노인 돌봄</span>
            <span class="usage-badge">30%</span>
        </div>
        <div class="usage-item">
            <span>긴급 난방비 및 의료비 지원</span>
            <span class="usage-badge">15%</span>
        </div>
        <div class="usage-item">
            <span>기타 사회공헌 활동</span>
            <span class="usage-badge">10%</span>
        </div>
    </div>

    <div class="footer">
        <p>매월 초 기부금 집행 내역이 업데이트됩니다.</p>
    </div>

</body>
</html>
