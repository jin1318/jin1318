<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나눔위크 | 우리가 잇는 따뜻한 한 땀</title>
<meta name="description" content="정기기부, 봉사활동, 키오스크 태깅기부, 사랑의걷기, 헌혈, 나눔메뉴 — 임직원이 함께 만드는 6가지 나눔활동">
<style>
  :root{
    --yellow: #FFE000;
    --yellow-deep: #E6C900;
    --cream: #FAF8EE;
    --ink: #111111;
    --white: #FFFFFF;
    --grey: #6B6B63;
    --line: rgba(17,17,17,0.10);
    --radius: 18px;
    --maxw: 1120px;
    --ease: cubic-bezier(.22,.9,.32,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  section{position:relative;}

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:100;
    background:var(--yellow);
    border-bottom:2px solid var(--ink);
  }
  .nav{
    display:flex; align-items:center; justify-content:space-between;
    max-width:var(--maxw); margin:0 auto; padding:14px 24px;
  }
  .logo{
    font-weight:800; font-size:1.15rem; letter-spacing:-0.02em;
    display:flex; align-items:center; gap:8px;
  }
  .logo .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--ink); display:inline-block;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.6); opacity:.55; }
  }
  nav ul{
    list-style:none; display:flex; gap:28px; margin:0; padding:0;
  }
  nav ul li a{
    font-weight:600; font-size:0.92rem; position:relative; padding:4px 0;
  }
  nav ul li a::after{
    content:""; position:absolute; left:0; bottom:-2px;
    width:0; height:2px; background:var(--ink);
    transition:width .28s var(--ease);
  }
  nav ul li a:hover::after{ width:100%; }

  .nav-tagline{
    font-weight:800; font-size:0.88rem; letter-spacing:-0.01em;
    white-space:nowrap;
  }

  .menu-toggle{
    display:none; flex-direction:column; gap:4px; background:none; border:none; cursor:pointer; padding:8px;
  }
  .menu-toggle span{ width:22px; height:2px; background:var(--ink); display:block; }

  /* ---------- HERO ---------- */
  .hero{
    padding:96px 0 80px;
    position:relative;
  }
  .hero .eyebrow{
    display:inline-block; font-size:0.8rem; font-weight:700; letter-spacing:0.08em;
    background:var(--white); border:1.5px solid var(--ink); padding:6px 14px; border-radius:999px;
    margin-bottom:26px;
  }
  .hero h1{
    font-size:clamp(2.3rem, 5.4vw, 4.1rem);
    line-height:1.14; letter-spacing:-0.03em; font-weight:800;
    margin:0 0 22px; max-width:820px;
  }
  .hero h1 .hl{
    background:linear-gradient(transparent 62%, var(--yellow) 62%);
    padding:0 2px;
  }
  .hero p{
    font-size:1.08rem; color:var(--grey); max-width:520px; line-height:1.65; margin:0 0 34px;
  }
  .hero-actions{ display:flex; gap:14px; flex-wrap:wrap; }
  .btn-primary{
    background:var(--ink); color:var(--white); padding:15px 26px; border-radius:999px;
    font-weight:700; font-size:0.95rem; display:inline-flex; align-items:center; gap:8px;
    transition:transform .22s var(--ease), box-shadow .22s;
  }
  .btn-primary:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(17,17,17,0.22); }
  .btn-secondary{
    background:transparent; color:var(--ink); padding:15px 26px; border-radius:999px;
    font-weight:700; font-size:0.95rem; border:2px solid var(--ink);
    transition: background .22s, color .22s, transform .22s var(--ease);
  }
  .btn-secondary:hover{ background:var(--ink); color:var(--white); transform:translateY(-3px); }

  .hero-stats{
    display:flex; gap:0; margin-top:64px; border-top:2px solid var(--ink); padding-top:28px;
    flex-wrap:wrap;
  }
  .hero-stats .stat{
    flex:1 1 150px; padding-right:24px;
  }
  .hero-stats .stat .num{
    font-size:2.1rem; font-weight:800; letter-spacing:-0.02em;
  }
  .hero-stats .stat .lbl{
    font-size:0.85rem; color:var(--grey); margin-top:4px;
  }

  /* ---------- STITCH LINE (signature element) ---------- */
  .stitch-rail{
    position:relative; padding:10px 0 40px;
  }
  .stitch-rail svg{ width:100%; height:auto; display:block; overflow:visible; }
  .stitch-path{
    fill:none; stroke:var(--ink); stroke-width:2.5;
    stroke-dasharray:10 9;
    stroke-dashoffset: 2000;
    transition: stroke-dashoffset 1.4s var(--ease);
  }
  .stitch-rail.in-view .stitch-path{ stroke-dashoffset: 0; }

  /* ---------- SECTION HEADS ---------- */
  .section-head{ margin-bottom:44px; max-width:640px; }
  .section-head .tag{
    display:inline-block; font-size:0.78rem; font-weight:700; color:var(--ink);
    background:var(--yellow); padding:5px 12px; border-radius:999px; margin-bottom:16px;
  }
  .section-head h2{
    font-size:clamp(1.6rem, 3.2vw, 2.4rem); font-weight:800; letter-spacing:-0.02em; margin:0 0 12px;
  }
  .section-head p{ color:var(--grey); line-height:1.6; margin:0; }

  /* ---------- 6 ACTIVITIES ---------- */
  .activities{ padding:20px 0 90px; }
  .grid-6{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;
  }
  .card{
    background:var(--white); border:2px solid var(--ink); border-radius:var(--radius);
    padding:28px 24px; position:relative; overflow:hidden;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
    opacity:0; transform:translateY(28px);
  }
  .card.visible{ opacity:1; transform:translateY(0); }
  .card:hover{
    transform:translateY(-8px) rotate(-0.4deg);
    box-shadow:0 16px 30px rgba(17,17,17,0.16);
  }
  .card .num{
    font-size:0.78rem; font-weight:700; color:var(--grey); letter-spacing:0.08em;
  }
  .card .icon{
    width:42px; height:42px; border-radius:12px; background:var(--yellow);
    display:flex; align-items:center; justify-content:center; margin:14px 0 18px;
    font-size:1.3rem; transition:transform .3s var(--ease);
  }
  .card:hover .icon{ transform:scale(1.12) rotate(8deg); }
  .card h3{ font-size:1.15rem; font-weight:800; margin:0 0 8px; letter-spacing:-0.01em; }
  .card p{ font-size:0.9rem; color:var(--grey); line-height:1.55; margin:0; }

  /* stagger */
  .card:nth-child(1){ transition-delay:.02s; }
  .card:nth-child(2){ transition-delay:.08s; }
  .card:nth-child(3){ transition-delay:.14s; }
  .card:nth-child(4){ transition-delay:.02s; }
  .card:nth-child(5){ transition-delay:.08s; }
  .card:nth-child(6){ transition-delay:.14s; }

  /* ---------- STORY (kiosk beneficiary) ---------- */
  .story{
    background:var(--ink); color:var(--white); padding:90px 0;
    border-radius:32px; margin:0 24px 90px; max-width:calc(var(--maxw) + 48px);
    margin-left:auto; margin-right:auto;
  }
  .story-inner{
    max-width:var(--maxw); margin:0 auto; padding:0 24px;
    display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;
  }
  .story .tag{
    display:inline-block; font-size:0.78rem; font-weight:700; color:var(--ink);
    background:var(--yellow); padding:5px 12px; border-radius:999px; margin-bottom:18px;
  }
  .story h2{ font-size:clamp(1.5rem,3vw,2.1rem); font-weight:800; line-height:1.35; margin:0 0 20px; }
  .story-quote{
    font-size:1.02rem; line-height:1.75; color:#D8D6C8; margin:0 0 24px;
    border-left:3px solid var(--yellow); padding-left:18px;
  }
  .story-name{ font-weight:700; font-size:0.9rem; }
  .story-role{ font-size:0.82rem; color:#9A988C; }
  .story-visual{
    aspect-ratio:4/3; background:#1C1C1C; border-radius:20px; border:2px solid #333;
    display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  }
  .story-visual .ring{
    width:64%; aspect-ratio:1; border-radius:50%; border:2px dashed var(--yellow);
    display:flex; align-items:center; justify-content:center; text-align:center;
    animation: spin 26s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .story-visual .ring span{
    display:block; color:var(--yellow); font-weight:800; font-size:0.85rem;
    animation: counterspin 26s linear infinite;
  }
  @keyframes counterspin{ to{ transform:rotate(-360deg); } }

  /* ---------- LIVE IMPACT NUMBERS ---------- */
  .impact{ padding:0 0 100px; }
  .impact-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:20px;
  }
  .impact-card{
    background:var(--white); border:2px solid var(--ink); border-radius:var(--radius);
    padding:26px 22px; text-align:left;
  }
  .impact-card .val{
    font-size:2.2rem; font-weight:800; letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
  }
  .impact-card .lbl{ font-size:0.85rem; color:var(--grey); margin-top:6px; }
  .impact-card .bar{
    height:6px; background:var(--cream); border-radius:999px; margin-top:16px; overflow:hidden;
    border:1px solid var(--line);
  }
  .impact-card .bar i{
    display:block; height:100%; background:var(--yellow); width:0%;
    transition:width 1.2s var(--ease);
  }

  /* ---------- EVENT BANNER / CTA ---------- */
  .banner{
    background:var(--yellow); border-radius:32px; margin:0 24px 90px;
    max-width:calc(var(--maxw) + 48px); margin-left:auto; margin-right:auto;
    padding:60px 48px; display:flex; align-items:center; justify-content:space-between; gap:40px;
    flex-wrap:wrap;
    border:2px solid var(--ink);
  }
  .banner h2{ font-size:clamp(1.4rem,2.6vw,2rem); font-weight:800; margin:0 0 8px; max-width:520px; }
  .banner p{ margin:0; color:#3a3a20; font-size:0.95rem; }
  .banner .btn-primary{ flex-shrink:0; }

  /* ---------- FOOTER ---------- */
  footer{ padding:50px 0 40px; border-top:2px solid var(--ink); }
  .footer-grid{
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:32px; margin-bottom:32px;
  }
  .footer-brand .logo{ margin-bottom:10px; }
  .footer-brand p{ color:var(--grey); font-size:0.85rem; max-width:280px; line-height:1.6; }
  .footer-links{ display:flex; gap:60px; flex-wrap:wrap; }
  .footer-links h4{ font-size:0.8rem; margin:0 0 12px; color:var(--grey); }
  .footer-links ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .footer-links a{ font-size:0.9rem; font-weight:600; }
  .footer-links a:hover{ text-decoration:underline; }
  .footer-bottom{
    font-size:0.78rem; color:var(--grey); display:flex; justify-content:space-between;
    flex-wrap:wrap; gap:10px; border-top:1px solid var(--line); padding-top:22px;
  }

  /* ---------- SCROLL REVEAL (generic) ---------- */
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal.visible{ opacity:1; transform:translateY(0); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 900px){
    .grid-6{ grid-template-columns:repeat(2,1fr); }
    .impact-grid{ grid-template-columns:repeat(2,1fr); }
    .story-inner{ grid-template-columns:1fr; }
    .story{ padding:60px 0; margin:0 16px 60px; }
  }
  @media (max-width: 720px){
    nav ul{
      position:fixed; top:64px; left:0; right:0; background:var(--yellow);
      flex-direction:column; gap:0; border-bottom:2px solid var(--ink);
      max-height:0; overflow:hidden; transition:max-height .3s var(--ease);
    }
    nav ul.open{ max-height:400px; }
    nav ul li{ border-top:1px solid rgba(17,17,17,0.15); width:100%; }
    nav ul li a{ display:block; padding:16px 24px; }
    nav ul li a::after{ display:none; }
    .nav-tagline{ display:none; }
    .menu-toggle{ display:flex; }
    .hero{ padding:56px 0 56px; }
    .hero-stats{ margin-top:40px; }
    .grid-6{ grid-template-columns:1fr; }
    .impact-grid{ grid-template-columns:1fr; }
    .banner{ padding:40px 24px; margin:0 16px 60px; }
    .story{ border-radius:22px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    html{ scroll-behavior:auto; }
  }

  /* ---------- KIOSK SHOWCASE ---------- */
  .kiosk-showcase{
    position:relative;
    padding:70px 0 90px;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,224,0,0.25), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.5), transparent 50%),
      linear-gradient(180deg, #2b2b26 0%, #46453d 55%, #5c5b50 100%);
  }
  .kiosk-showcase::before{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.35));
    pointer-events:none;
  }
  .kiosk-showcase-inner{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:26px;
  }
  .kiosk-caption{
    text-align:center; color:var(--white);
  }
  .kiosk-caption .tag{
    display:inline-block; font-size:0.78rem; font-weight:700; color:var(--ink);
    background:var(--yellow); padding:5px 12px; border-radius:999px; margin-bottom:14px;
  }
  .kiosk-caption h2{
    font-size:clamp(1.4rem,2.6vw,2rem); font-weight:800; margin:0; letter-spacing:-0.02em
